# Tiny offline configuration: synthetic data, mock teacher, a tiny random model,
# mutation verifier. Checks that the pipeline runs end to end; numbers are meaningless.
base: default.yaml
paths:
  output_dir: outputs/smoke
data:
  train_benchmarks: [synthetic]
  eval_benchmarks: [synthetic]
teacher:
  backend: mock
student:
  model: hf-internal-testing/tiny-random-LlamaForCausalLM
  bf16: false
  gradient_checkpointing: false
latent:
  top_k: 4
curriculum:
  epochs_per_stage: 1
  batch_size: 4
rl:
  group_size: 2
  max_new_tokens: 16
  batch_prompts: 1
  grad_accum: 1
  max_train_examples: 2
  verifier: mutation
eval:
  max_new_tokens: 16
