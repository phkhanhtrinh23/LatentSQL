# A 50/50 BIRD/Spider teacher corpus, ~1000 questions - scaled up from
# latent_sft_big.yaml's ~350 (which produced only ~187-282 usable records
# after teacher-consensus/prompt-length/OOM attrition, thin for 9 curriculum
# depths to share and prone to the same small-corpus collapse RESULTS.md 5d
# already documented). Same 4-system panel + rescue rule; only the size and
# output location differ. The starting SFT checkpoint (sft.output_dir below)
# intentionally still points at the EXISTING outputs/latent_sft_big/sft
# checkpoint, not a new one - the curriculum's base only needs the general
# "debate text -> SQL" text-mode skill, which transfers, so there's no need
# to redo the plain-SFT stage for this larger corpus.

paths:
  bird_root: /mnt/win_d/data/sft_data_collections/bird
  spider_root: /mnt/win_d/data/sft_data_collections/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/latent_sft_1000
  cache_dir: outputs/latent_sft_1000/cache

mix:
  bird: 500
  spider: 500
  shuffle: true

llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-7B-Instruct     # teacher
  model_fallbacks: [Qwen/Qwen2.5-7B-Instruct]
  quantization: 4bit
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [din_sql, dail_sql, chess, chase_sql]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 2
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  schema_keep_all_below_columns: 40

trace:
  rescue_correct_agent: true
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  output_dir: outputs/latent_sft_big/sft   # reuse - see header comment
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 4
  max_seq_len: 4096
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  quantization: 4bit
  gradient_checkpointing: true
  train_on_full_trace: true
  logging_steps: 2

grpo:
  model_name_or_path: outputs/latent_sft_1000/sft
  output_dir: outputs/latent_sft_1000/grpo
  epochs: 8
  lr: 1.0e-6
  group_size: 4
  batch_prompts: 1
  grad_accum: 2
  max_new_tokens: 400
  kl_beta: 0.02
  bf16: true
  quantization: 4bit
  logging_steps: 1
  save_steps: 4
  micro_batch: 1
  latent_rollouts: true
  spec_decode: true
  spec_draft_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
  spec_k: 3
  reward:
    w_fmt_start: 0.0
    w_fmt_end: 0.0
    w_clip: 1.0
    len_start: 2560
    len_end: 2560
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1
    w_atomic: 0.5
    w_memory: 0.3

latent:
  enabled: true
  latent_steps: 12
  roles: [din_sql, dail_sql, chess, chase_sql, din_sql, dail_sql, chess, chase_sql, consensus]
  align: soft_embed   # reverted: raw hidden-state feedback (identity) produced degenerate
                       # token-soup output at eval, consistent with this codebase's own
                       # pre-existing docstring warning that identity mode is OOD (LatentMAS).
                       # Keeping the other 3 COCONUT fixes (direction, text supervision, scale).
  share_working_memory: true
  train_latent_slots: true   # curriculum: progressively replace explicit roles with latent ones

eval:
  dataset: mix
  n_samples: 90
  max_new_tokens: 400
  temperature: 0.0
  report_ves: false

seed: 0
