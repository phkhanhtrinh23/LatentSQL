# Pure text-mode IMAD (no latent rollouts - that combination is shelved, see
# RESULTS.md 5c) + speculative decoding to buy the GRPO step count IMAD's own
# paper needs. Every real result in RESULTS.md came from this exact regime
# (SFT and GRPO both operating on the written debate, matched conditioning);
# this config only changes two things versus run 3: (1) speculative decoding
# accelerates rollout generation so more steps fit in the same wall-clock, and
# (2) the SFT/GRPO corpus is the full 4-system panel with the rescue rule
# already applied (63 kept traces, not 48 or 45 CHESS-only), so every
# question is internalised from whichever of DIN-SQL/DAIL-SQL/CHESS/CHASE-SQL
# actually got it right, not from CHESS alone.
#
#   bash scripts/run_imad_boost.sh

paths:
  bird_root: /mnt/win_d/data/sft_data_collections/bird
  spider_root: /mnt/win_d/data/sft_data_collections/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/imad_boost
  cache_dir: outputs/imad_boost/cache

mix:
  bird: 30
  spider: 60
  shuffle: true

llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-7B-Instruct     # teacher (inert here - traces are reused)
  model_fallbacks: [Qwen/Qwen2.5-7B-Instruct]
  quantization: 4bit
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [din_sql, dail_sql, chess, chase_sql]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 2
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  schema_keep_all_below_columns: 40

trace:
  rescue_correct_agent: true    # keep a debate when ANY panellist was right -
                                 # this is what raised the corpus 48 -> 63
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct   # student
  output_dir: outputs/imad_boost/sft
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 4
  max_seq_len: 4096          # rescue corpus's longest trace is ~11.5k chars
                              # (~3.1k tokens); 3072 (run 3's value) would clip it
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  quantization: 4bit          # QLoRA
  gradient_checkpointing: true
  train_on_full_trace: true
  logging_steps: 2

grpo:
  model_name_or_path: outputs/imad_boost/sft
  output_dir: outputs/imad_boost/grpo
  epochs: 8                  # 63 kept traces, group_size 4, grad_accum 2
                              # -> ~252 optimizer steps (IMAD-scale, not 15-35)
  lr: 1.0e-6
  group_size: 4
  batch_prompts: 1
  grad_accum: 2
  max_new_tokens: 4000        # must exceed len_start
  kl_beta: 0.02
  bf16: true
  quantization: 4bit
  logging_steps: 1
  save_steps: 4                # checkpoint often - safe to stop early anytime
  micro_batch: 1
  latent_rollouts: false       # explicit: text mode, matched to SFT's target
  spec_decode: true            # Iso et al. 2026 - lossless rollout acceleration
  spec_draft_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
  spec_k: 3                    # Table 4: k=3 is the sweet spot; k>=5 is slower
  reward:
    w_fmt_start: 1.0
    w_fmt_end: 0.05
    w_clip: 1.0
    len_start: 3600           # IMAD: above the rescue corpus's max trace (~3.1k tok)
    len_end: 500               # IMAD's l*
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1
    # FINER-SQL dense partial credit (run 3: 3.2x the gradient on all-wrong
    # groups, zero dead steps there vs binary reward)
    w_atomic: 0.5
    w_memory: 0.3

latent:
  enabled: false
  latent_steps: 8
  roles: [din_sql, dail_sql, chess, chase_sql, consensus]
  align: soft_embed
  share_working_memory: true

eval:
  dataset: mix
  n_samples: 90
  max_new_tokens: 3072
  temperature: 0.0
  report_ves: false

seed: 0
