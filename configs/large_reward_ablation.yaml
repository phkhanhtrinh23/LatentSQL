paths:
  bird_root: /mnt/win_d/data/sft_data_collections/bird
  spider_root: /mnt/win_d/data/sft_data_collections/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/large_reward_ablation
  cache_dir: outputs/large_reward_ablation/cache

mix:
  bird: 500
  spider: 500
  shuffle: true

llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-7B-Instruct
  model_fallbacks: [Qwen/Qwen2.5-7B-Instruct]
  quantization: 4bit
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [din_sql, dail_sql, chess, chase_sql]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 2
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  schema_keep_all_below_columns: 40

trace:
  rescue_correct_agent: true
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
  output_dir: outputs/latent_sft_1000/sft_7b_bf16
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 4
  max_seq_len: 2560
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  quantization: none
  gradient_checkpointing: true
  train_on_full_trace: true

grpo:
  model_name_or_path: outputs/latent_sft_1000/sft_7b_bf16
  output_dir: outputs/large_reward_ablation/grpo_binary
  epochs: 1
  lr: 1.0e-6
  group_size: 4
  batch_prompts: 1
  grad_accum: 2
  max_new_tokens: 1024
  kl_beta: 0.02
  bf16: true
  quantization: 4bit
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 25
  micro_batch: 1
  latent_rollouts: false
  spec_decode: true
  spec_draft_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
  spec_k: 3
  reward:
    w_fmt_start: 1.0
    w_fmt_end: 0.05
    w_clip: 1.0
    len_start: 900
    len_end: 400
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1
    w_atomic: 0.0
    w_memory: 0.0
    w_spurious: 0.0
    n_stress_instances: 3
    stress_cache_dir: outputs/large_reward_ablation/cache/stress
    cleanup_stress_cache: true

latent:
  enabled: false
  latent_steps: 8
  roles: [din_sql, dail_sql, chess, chase_sql, consensus]
  align: soft_embed
  share_working_memory: true

eval:
  dataset: mix
  n_samples: 90
  max_new_tokens: 1024
  temperature: 0.0
  report_ves: false

seed: 0
