# Full-precision (no 4-bit) variant of latent_sft_1000_7b.yaml. sft.quantization
# is "none" - bf16 weights only, ~15.2GB baseline for the 7B model, versus
# ~4GB for 4-bit - so there is much less headroom left for the activation
# spikes that have caused every OOM this project has hit; eval.max_new_tokens
# is cut from 400 to 200 specifically to bound generation-time memory (a long/
# rambling completion's KV cache growth was the main way a single eval sample
# could overshoot the GPU cap). Training itself never autoregressively
# generates (teacher-forced against known target tokens), so max_new_tokens
# doesn't bound training memory - that's still --max-prompt-chars/
# --max-role-chars plus the GPU_FRACTION cap.

paths:
  bird_root: /mnt/win_d/data/sft_data_collections/bird
  spider_root: /mnt/win_d/data/sft_data_collections/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/latent_sft_1000
  cache_dir: outputs/latent_sft_1000/cache

mix:
  bird: 500
  spider: 500
  shuffle: true

llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-7B-Instruct     # teacher
  model_fallbacks: [Qwen/Qwen2.5-7B-Instruct]
  quantization: 4bit
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [din_sql, dail_sql, chess, chase_sql]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 2
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  schema_keep_all_below_columns: 40

trace:
  rescue_correct_agent: true
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
  output_dir: outputs/latent_sft_1000/sft_7b_bf16
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 4
  max_seq_len: 2560   # tightened from 4096: bf16's 15.2GB weight baseline leaves much
                       # less margin than 4-bit for a near-max-length sequence's
                       # activations - records whose prompt alone still exceeds this
                       # are pruned (see sft.py's n_pruned log line), not truncated
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  quantization: none
  gradient_checkpointing: true
  train_on_full_trace: true
  logging_steps: 2

grpo:
  model_name_or_path: outputs/latent_sft_1000/sft
  output_dir: outputs/latent_sft_1000/grpo
  epochs: 8
  lr: 1.0e-6
  group_size: 4
  batch_prompts: 1
  grad_accum: 2
  max_new_tokens: 400
  kl_beta: 0.02
  bf16: true
  quantization: 4bit
  logging_steps: 1
  save_steps: 4
  micro_batch: 1
  latent_rollouts: true
  spec_decode: true
  spec_draft_model: Qwen/Qwen2.5-Coder-0.5B-Instruct
  spec_k: 3
  reward:
    w_fmt_start: 0.0
    w_fmt_end: 0.0
    w_clip: 1.0
    len_start: 2560
    len_end: 2560
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1
    w_atomic: 0.5
    w_memory: 0.3
    # Latent rollouts often produce all-correct groups. Without a tie-breaker,
    # every rollout receives 1.0 correctness + 0.1 executable SQL and GRPO has
    # zero advantage. Brevity is awarded only to correct rollouts, so it gives
    # signal inside saturated groups without rewarding wrong short answers.
    w_brevity: 0.2

latent:
  enabled: true
  latent_steps: 12
  roles: [din_sql, dail_sql, chess, chase_sql, din_sql, dail_sql, chess, chase_sql, consensus]
  align: soft_embed   # reverted: raw hidden-state feedback (identity) produced degenerate
                       # token-soup output at eval, consistent with this codebase's own
                       # pre-existing docstring warning that identity mode is OOD (LatentMAS).
                       # Keeping the other 3 COCONUT fixes (direction, text supervision, scale).
  share_working_memory: true
  train_latent_slots: true   # curriculum: progressively replace explicit roles with latent ones

eval:
  dataset: mix
  n_samples: 90
  max_new_tokens: 200   # capped from 400 - bounds a runaway/rambling sample's
                         # KV-cache growth so it can't overshoot the GPU cap
  temperature: 0.0
  report_ves: false

seed: 0
