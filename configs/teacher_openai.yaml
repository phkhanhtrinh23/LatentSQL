# OPTIONAL: drive the teacher with an OpenAI-compatible API instead of a
# local model. This is NOT the default - the project runs local-first, and
# every result in the README was produced with `backend: hf`.
#
# Use it only when you want a stronger teacher than your hardware can host:
#
#   export OPENAI_API_KEY=...
#   python scripts/01_build_traces.py --config configs/teacher_openai.yaml
#
# The same file also points at any OpenAI-compatible server (vLLM, SGLang,
# Ollama) - just set base_url and leave the key empty.

paths:
  bird_root: /mnt/win_d/data_FusionSQL/bird
  spider_root: /mnt/win_d/data_FusionSQL/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/bird_openai_teacher

llm:
  backend: openai
  model: gpt-4o-mini
  # base_url: http://localhost:8000/v1   # uncomment for a local vLLM server
  api_key_env: OPENAI_API_KEY
  temperature: 0.7
  max_tokens: 1024
  max_retries: 3

mas:
  agents: [divide_conquer, query_plan, dail_icl]
  rounds: 2
  selector: unit_test

# the student stays local regardless of who the teacher is
sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  output_dir: outputs/bird_openai_teacher/sft

grpo:
  model_name_or_path: outputs/bird_openai_teacher/sft
  output_dir: outputs/bird_openai_teacher/grpo

eval:
  dataset: bird

seed: 0
