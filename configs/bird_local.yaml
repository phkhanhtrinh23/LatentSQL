# BIRD, local models only. This is the main config.
#
#   python scripts/01_build_traces.py --config configs/bird_local.yaml --limit 3000
#   python scripts/02_sft.py         --config configs/bird_local.yaml
#   python scripts/03_grpo.py        --config configs/bird_local.yaml
#   python scripts/04_eval.py        --config configs/bird_local.yaml \
#       --methods single,din_sql,dail_sql,chess,chase_sql,fusion_mas,student,latent

paths:
  bird_root: /mnt/win_d/data_FusionSQL/bird
  spider_root: /mnt/win_d/data_FusionSQL/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/bird
  cache_dir: outputs/bird/cache

# ---------------------------------------------------------------------------
# teacher: an open-weight model from the local hub. No network, no API key.
# Run scripts/00_list_models.py to see what is actually available, then set
# `model` to one of the names it prints.
# ---------------------------------------------------------------------------
llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  model_fallbacks:
    - Qwen/Qwen2.5-Coder-7B-Instruct
    - Qwen/Qwen2.5-7B-Instruct
    - meta-llama/Llama-3.1-8B-Instruct
    - Qwen/Qwen2.5-Coder-3B-Instruct
    - Qwen/Qwen2.5-Coder-1.5B-Instruct
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [divide_conquer, query_plan, dail_icl]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 3
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  # BIRD schemas are large; prune below this many columns only
  schema_keep_all_below_columns: 40

trace:
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

# ---------------------------------------------------------------------------
# student: a small local model (< 7B)
# ---------------------------------------------------------------------------
sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct
  output_dir: outputs/bird/sft
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 8
  max_seq_len: 4096
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  gradient_checkpointing: true
  train_on_full_trace: true       # false = DebateGPT ablation

grpo:
  model_name_or_path: outputs/bird/sft
  output_dir: outputs/bird/grpo
  epochs: 2
  lr: 1.0e-6
  group_size: 8
  batch_prompts: 2
  grad_accum: 4
  max_new_tokens: 2048
  kl_beta: 0.02
  bf16: true
  reward:
    w_fmt_start: 1.0
    w_fmt_end: 0.05
    w_clip: 1.0
    len_start: 2000              # IMAD anneals 2000 -> 500
    len_end: 500
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1

latent:
  enabled: false                 # turn on for the `latent` eval mode
  latent_steps: 8
  roles: [divide_conquer, query_plan, dail_icl, consensus]
  align: soft_embed
  share_working_memory: true

steering:
  layer: -8
  alpha: 1.0
  n_pairs: 128
  normalize: true

eval:
  dataset: bird
  n_samples: 300
  max_new_tokens: 1024
  temperature: 0.0
  report_ves: true

seed: 0
