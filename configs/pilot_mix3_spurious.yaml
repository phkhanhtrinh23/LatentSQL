# The third arm of the dense-reward ablation (RESULTS.md 5b /
# scripts/run_ablation3.sh): same teacher, same SFT checkpoint, same data as
# the "dense" arm (pilot_mix3_dense.yaml) - only w_spurious is added on top of
# w_atomic/w_memory, to test whether discounting spuriously-correct rollouts
# (latentsql/db/spurious.py, EX-Ext adapted) helps GRPO beyond dense partial
# credit alone. See scripts/run_ablation_spurious.sh.

paths:
  bird_root: /mnt/win_d/data/sft_data_collections/bird
  spider_root: /mnt/win_d/data/sft_data_collections/spider
  hf_hub: /mnt/win_d/hub
  output_dir: outputs/pilot3
  cache_dir: outputs/pilot3/cache

mix:
  bird: 30
  spider: 60
  shuffle: true

llm:
  backend: hf
  local_only: true
  model: Qwen/Qwen2.5-7B-Instruct     # teacher
  model_fallbacks: [Qwen/Qwen2.5-7B-Instruct]
  quantization: 4bit
  temperature: 0.7
  max_tokens: 1024
  device: auto
  dtype: auto

mas:
  agents: [din_sql, dail_sql, chess, chase_sql]
  rounds: 2
  candidates_per_agent: 1
  use_value_retrieval: true
  use_schema_selector: true
  use_classifier: true
  use_fixer: true
  max_fix_attempts: 2
  selector: unit_test
  n_unit_tests: 3
  dail_shots: 5
  execution_timeout: 30.0
  schema_keep_all_below_columns: 40

trace:
  require_consensus: true
  require_correct: true
  require_execution: true
  max_trace_chars: 12000
  dedup: true

sft:
  model_name_or_path: Qwen/Qwen2.5-Coder-3B-Instruct   # student
  output_dir: outputs/pilot3/sft
  epochs: 3
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 4
  max_seq_len: 3072
  lora: true
  lora_r: 32
  lora_alpha: 64
  bf16: true
  quantization: 4bit          # QLoRA
  gradient_checkpointing: true
  train_on_full_trace: true
  logging_steps: 2

grpo:
  model_name_or_path: outputs/pilot3/sft
  output_dir: outputs/pilot3/grpo
  epochs: 1
  lr: 1.0e-6
  group_size: 4
  batch_prompts: 1
  grad_accum: 2
  max_new_tokens: 1024        # pilot budget; the real run uses 2048
  kl_beta: 0.02
  bf16: true
  quantization: 4bit
  logging_steps: 1
  save_steps: 2        # short run: keep partial progress if it dies
  micro_batch: 1
  reward:
    w_fmt_start: 1.0
    w_fmt_end: 0.05
    w_clip: 1.0
    len_start: 900            # compressed anneal so a short run still moves
    len_end: 400
    schedule: linear
    w_exec_ok: 0.1
    w_tag_order: 0.1
    # FINER-SQL dense partial credit, awarded only to WRONG rollouts - same as
    # the "dense" arm, held fixed so w_spurious is the only changed variable
    w_atomic: 0.5
    w_memory: 0.3
    # the new term: discount correctness credit on CORRECT rollouts that do
    # not survive re-execution on synthetic stress instances built from gold's
    # own WHERE/HAVING literals (latentsql/db/spurious.py). 5 instances is the
    # paper's own choice (pool_text2sql_crowd_source_mixture/main_pool_eval.pdf
    # Appendix B's EX-Ext uses 5 modified copies).
    w_spurious: 0.5
    n_stress_instances: 5

latent:
  enabled: false
  latent_steps: 8
  roles: [din_sql, dail_sql, chess, chase_sql, consensus]
  align: soft_embed
  share_working_memory: true

eval:
  dataset: mix
  n_samples: 24
  max_new_tokens: 1024
  temperature: 0.0
  report_ves: false           # VES needs repeat timing runs; out of pilot budget

seed: 0
